apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  selector:
    matchLabels:
      app: auth-service
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      restartPolicy: Always
      initContainers:
        - name: migrate
          image: ${IMAGE}
          command: ["sh", "-c", "npx prisma migrate deploy"]
          envFrom:
            - configMapRef:
                name: auth-service
      containers:
        - name: auth-service
          image: ${IMAGE}
          command: ["sh", "-c", "pnpm run prod"]
          envFrom:
            - configMapRef:
                name: auth-service
          ports:
            - containerPort: 3000
              name: auth-service