apiVersion: v1
kind: ConfigMap
metadata:
  name: test-client
data:
  PORT: "3000"
  NODE_ENV: "production"
  # Cluster-internal DNS; no need to route through the public gateway.
  AUTH_SERVICE_URL: "http://auth-service.staging.svc.cluster.local:3000"
  OAUTH_CLIENT_ID: "${TEST_CLIENT_OAUTH_CLIENT_ID}"
  OAUTH_CLIENT_SECRET: "${TEST_CLIENT_OAUTH_CLIENT_SECRET}"
  COOKIE_SECRET: "${TEST_CLIENT_COOKIE_SECRET}"
