apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service
data:
  APP_URL: "https://auth-test.pa-f.net"
  # Public base URL of the login surface; used to build magic links and the
  # ext_authz login redirect.
  AUTH_PUBLIC_URL: "https://auth-test.pa-f.net"
  # SSO cookie is valid across every *.pa-f.net subdomain.
  COOKIE_DOMAIN: ".pa-f.net"
  NODE_ENV: "production"
  # Shared paf-admin MariaDB. Member rows live in `members` (a view onto
  # paf-admin's table), OAuth tables are owned by auth-service migrations.
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_USER: "${AUTH_SERVICE_DATABASE_USER}"
  MYSQL_PASSWORD: "${AUTH_SERVICE_DATABASE_PASSWORD}"
  MYSQL_DB_NAME: "${AUTH_SERVICE_DATABASE_NAME}"
  OAUTH_CODES_SECRET: "${AUTH_SERVICE_OAUTH_CODES_SECRET}"
  COOKIE_SECRET: "${AUTH_SERVICE_COOKIE_SECRET}"
  # Internal OAuth client the login flow authenticates against.
  SSO_CLIENT_ID: "sso"
  SSO_CLIENT_SECRET: "${AUTH_SERVICE_SSO_CLIENT_SECRET}"
